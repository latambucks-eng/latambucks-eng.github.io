<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script>
    var path = window.location.pathname || '';
    var search = window.location.search || '';
    var hash = window.location.hash || '';
    if (hash.indexOf('type=recovery') !== -1 || hash.indexOf('access_token=') !== -1) {
      window.location.replace('https://github.io' + hash);
    } else if (path && path !== '/') {
      window.location.replace('https://github.io' + path + search);
    } else {
      window.location.replace('https://github.io' + search + hash);
    }
  </script>
</head>
<body>Redirigiendo...</body>
</html>
