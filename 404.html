    var search = window.location.search || '';
    var hash = window.location.hash || '';

      window.location.replace(base + '#/reset-password' + hash);
    } else if (path && path !== '/') {
      window.location.replace(base + '#' + path + search);
    } else {
      window.location.replace(base + search + hash);
    }
